        <main>
        <h1 id="donate">How to Donate</h1>
        <!-- Going to have the lists here -->
        
            
        <form method="get" class="myForm" action="thanks.html">

        <fieldset>
        <legend>Where would you like the trees you donated for to go?</legend>    
        <label>State*<input type="text" name="state" required></label>
        <label>City*<input type="text" name="city" required></label>    
        <label>Cell Number*<input type="tel" name="phone" required placeholder="000-000-0000"></label>
        <label>Email*<input type="email" name="mail" required placeholder="someone@email.com"></label>        
        </fieldset>     
            
            <fieldset>
        <legend>Payment Options</legend>
        <label><input type="radio" name="method" value="drone">10$</label>
        <label><input type="radio" name="method" value="cycle">50$</label>
        <label><input type="radio" name="method" value="robot">100$</label>
        </fieldset>   

            <fieldset>
        <legend>What type of tree would you like your donation to go towards</legend>    
            <label><input type="checkbox" name="oak" value="chosen">Oak</label>
            <label><input type="checkbox" name="birch" value="chosen">Birch</label>
            <label><input type="checkbox" name="cedar" value="chosen">Cedar</label>
            <label><input type="checkbox" name="maple" value="chosen">Maple</label>
            
            <label>Prefered Payment Method
            <select name="time">
            <option value="none">Please Select</option>
            <option value="credit">Credit Card</option>
            <option value="debit">Debit Card</option>
            <option value="venmo">Venmo</option>
            <option value="apple">Apple Pay</option>
            </select>
            </label>
        </fieldset>       
            
            
            
         <label>Other payment method
            <textarea name="payment"></textarea>
            </label>         
            
            <input type="submit" value="Send Delivery Request">
        </form>
        </main>
